packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': false
  bcrypt: false
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@prisma/config@7.10.1'
  - '@prisma/debug@7.10.1'
  - '@prisma/engines@7.10.1'
  - '@prisma/fetch-engine@7.10.1'
  - '@prisma/get-platform@7.10.1'
  - prisma@7.10.1
  - '@prisma/client@7.10.1'
  - '@prisma/adapter-mariadb@7.10.1'
  - '@prisma/driver-adapter-utils@7.10.1'
  - '@prisma/client-runtime-utils@7.10.1'
  - ts-jest@29.4.15
