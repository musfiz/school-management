<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Model High School crest">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172c5c"/>
      <stop offset="1" stop-color="#0b1630"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7d277"/>
      <stop offset="1" stop-color="#e0a020"/>
    </linearGradient>
    <path id="topArc" d="M 70 200 A 130 130 0 0 1 330 200" />
    <path id="botArc" d="M 72 200 A 128 128 0 0 0 328 200" />
  </defs>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="194" fill="url(#navy)" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.7"/>

  <!-- Circular text -->
  <text fill="url(#gold)" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">MODEL HIGH SCHOOL</textPath>
  </text>
  <text fill="#cfe0ff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">EST. 1972</textPath>
  </text>

  <!-- Star above the book -->
  <path d="M200 96 l9 19 21 3 -15 15 4 21 -19 -10 -19 10 4 -21 -15 -15 21 -3 z" fill="url(#gold)"/>

  <!-- Open book -->
  <g stroke="url(#gold)" stroke-width="4" stroke-linejoin="round">
    <path d="M130 250 c20 -22 44 -22 70 -8 c26 -14 50 -14 70 8 c-22 -10 -44 -10 -70 4 c-26 -14 -48 -14 -70 -4 z" fill="#0b1630"/>
    <path d="M200 242 v54" fill="none"/>
    <path d="M130 250 c20 -22 44 -22 70 -8 v54 c-26 -14 -48 -14 -70 -4 z" fill="#13224a"/>
    <path d="M200 242 c26 -14 50 -14 70 8 v54 c-22 -10 -44 -10 -70 4 z" fill="#13224a"/>
  </g>
  <path d="M148 256 l18 8 M148 270 l18 8 M234 264 l18 -8 M234 278 l18 -8" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>
</svg>
